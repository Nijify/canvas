name: Pages

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "packages/canvas_core/**"
      - "packages/canvas_scene_upgrade/**"
      - "packages/canvas_renderer_flutter/**"
      - "packages/canvas_editor_flutter/**"
      - "packages/canvas_svg_export/**"
      - "pubspec.lock"
      - "pubspec.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        id: dependencies
        run: flutter pub get

      - name: Test example
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: packages/canvas_editor_flutter/example
        run: flutter test

      - name: Test core
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: packages/canvas_core
        run: dart test

      - name: Test scene upgrades
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: packages/canvas_scene_upgrade
        run: dart test

      - name: Test Flutter renderer
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: packages/canvas_renderer_flutter
        run: flutter test

      - name: Test Flutter editor
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: packages/canvas_editor_flutter
        run: flutter test

      - name: Test SVG exporter
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: packages/canvas_svg_export
        run: dart test

      - name: Test data URI metadata in Chrome
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: packages/canvas_editor_flutter/example
        run: flutter test --platform chrome test/data_uri_image_metadata_test.dart

      - name: Build web example
        working-directory: packages/canvas_editor_flutter/example
        run: flutter build web --release --base-href /canvas/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/canvas_editor_flutter/example/build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
