[project]
name = "nijify-isnet-tooling"
version = "0.1.0"
description = "Reproducible ISNet conversion and parity tooling"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.poetry]
name = "nijify-isnet-tooling"
version = "0.1.0"
description = "Reproducible ISNet conversion and parity tooling"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = "1.26.4"
protobuf = "4.25.3"
flatbuffers = "23.5.26"
onnx = "1.15.0"
onnxruntime = "1.17.1"
onnxsim = "0.4.36"
onnx2tf = "1.21.0"
onnx-graphsurgeon = "0.5.2"
sng4onnx = "1.0.4"
simple-onnx-processing-tools = "1.1.6"
tensorflow = "2.16.1"
tf-keras = "2.16.0"
psutil = "5.9.5"
ml-dtypes = "0.3.2"
