name: canvas_editor_flutter
description: Complete Flutter scene editor for canvas_core documents with turnkey UI and composable editing, asset, image-import, image-tools, and export capabilities.
version: 0.24.0
repository: https://github.com/Nijify/canvas
issue_tracker: https://github.com/Nijify/canvas/issues
topics:
  - canvas
  - editor
  - flutter
  - graphics

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.11.1
  provider: ^6.1.2
  nested: ^1.0.0

  canvas_core: ^0.20.0
  canvas_renderer_flutter: ^0.19.0
  vector_math: ^2.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
