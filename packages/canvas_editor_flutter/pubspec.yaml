name: canvas_editor_flutter
description: Complete Flutter scene editor for canvas_core documents with turnkey UI and composable editing, asset, image-import, image-tools, and export capabilities.
version: 0.11.3
repository: https://github.com/Nijify/canvas
issue_tracker: https://github.com/Nijify/canvas/issues
topics:
  - canvas
  - editor
  - flutter
  - graphics

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  nested: ^1.0.0

  canvas_core: ^0.8.2
  canvas_renderer_flutter: ^0.7.0
  vector_math: ^2.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
