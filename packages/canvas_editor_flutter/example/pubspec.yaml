name: canvas_editor_flutter_example
description: Runnable public integration example for the canvas_editor_flutter package
publish_to: "none"

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  canvas_editor_flutter:
    path: ../

  canvas_core: ^0.9.0
  canvas_renderer_flutter: ^0.8.1
  image_picker: ^1.2.1
  share_plus: ^11.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/demo_assets/
    - assets/fonts/noto_sans_symbols/NotoSansSymbols-Regular.ttf
    - assets/fonts/noto_sans_symbols/OFL.txt
